# Audit Log Priority Configuration
# This file defines how audit rule keys are classified by security level
# Format: Each section contains keys that will be assigned that priority level

[high]
# SUID root execution - privilege escalation indicator
suid_root_exec
# Root SSH key access - potential credential theft
rootkey
# 32-bit ABI usage on 64-bit system - common exploitation technique
32bit_abi
# Anonymous file creation - malware/rootkit indicator
anon_file_create
# Network connections - potential data exfiltration or C2
network_connect_4
network_connect_6
# Network socket creation
network_socket_created

[medium]
# Identity and authentication changes
identity_mod
# Permission modifications
perm_mod
# Filesystem mounts
mounts
# Sudo log modifications
sudo_log_mod
# Sudoers file changes
sudoers_mod
# User privilege escalation (sudo/su)
user_emulation
# System time changes
time_change
# Network/system environment changes
system_env
# Failed file access attempts
failed_access
# Session tracking (logins/logouts)
session
# File deletions
file_delete
# Mandatory Access Control policy changes
MAC_policy
# SELinux/ACL modifications
conf_chcon
conf_setfacl
conf_chacl
# User account modifications
usermod
# Kernel module loading/unloading
kernel_modules
# Firewall configuration changes
firewall
# Systemd service management
systemd_monitoring
# Cron job modifications
cron_events
# Audit configuration changes
auditconfig
# Audit tool usage
audittools
# Suspicious activity (netcat, wget, curl, etc.)
susp_activity
# Credential/string searching (grep, rg, etc.)
string_search
# Reconnaissance commands (whoami, id, uname, etc.)
recon

[low]
# General command execution (only in high ruleset)
exec_all
