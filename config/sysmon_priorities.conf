# Sysmon Event Priority Configuration
# Classifies Sysmon events by Event ID into high/medium/low priority levels
# 
# Format: One event ID per line under the appropriate section
# Event IDs can include comments after the number
#
# Reference: https://docs.microsoft.com/en-us/sysinternals/downloads/sysmon

[high]
# CreateRemoteThread - Code injection technique
8
# ProcessAccess - Memory access (credential dumping)
10
# ProcessTampering - Process hollowing/injection
25

[medium]
# WMI Event Filter - Persistence mechanism
19
# WMI Event Consumer - Persistence mechanism
20
# WMI Event Consumer To Filter - Persistence binding
21
# ProcessCreate - New process execution
1
# RegistryEvent (Object create/delete) - Registry modifications
12
# RegistryEvent (Value Set) - Registry value changes
13
# RegistryEvent (Key/Value Rename) - Registry renames
14
# FileCreateStreamHash - Alternate data streams
15
# PipeEvent (Created) - Named pipe creation
17
# PipeEvent (Connected) - Named pipe connection
18
# FileDelete - File deletion
23
# FileDeleteDetected - File deletion detected
26

[low]
# FileCreationTimeChanged - Timestomp attempts
2
# NetworkConnect - Network connections
3
# SysmonServiceStateChanged - Sysmon state changes
4
# ProcessTerminate - Process exit
5
# DriverLoad - Driver loading
6
# ImageLoad - DLL/module loading
7
# RawAccessRead - Raw disk access
9
# FileCreate - File creation
11
# SysmonConfigStateChanged - Config changes
16
# DnsQuery - DNS lookups
22
# ClipboardChange - Clipboard monitoring
24
