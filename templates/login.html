{{define "page_resources"}}
{{end}}

{{define "content"}}
<div class="row">
    <div class="col s12 m6 offset-m3">
        <div class="card">
            <div class="card-content">
                <span class="card-title center-align">Login</span>
                
                {{if .Error}}
                <div class="card-panel red lighten-1 white-text">{{.Error}}</div>
                {{end}}
                
                {{if .Success}}
                <div class="card-panel green lighten-1 white-text">{{.Success}}</div>
                {{end}}
                
                {{if index .Data "ShowRemainingAttempts"}}
                <div class="card-panel blue lighten-1 white-text">
                    <p>Remaining attempts: <strong>{{index .Data "RemainingAttempts"}}</strong></p>
                </div>
                {{end}}
                
                <form method="POST" action="/login">
                    <div class="input-field">
                        <input type="text" id="username" name="username" required>
                        <label for="username">Username</label>
                    </div>
                    <div class="input-field">
                        <input type="password" id="password" name="password" required>
                        <label for="password">Password</label>
                    </div>
                    <div class="center-align">
                        <button type="submit" class="btn btn-primary waves-effect waves-light">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
