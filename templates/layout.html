{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{.FormToken}}">
    <title>{{.Title}} - agent<</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/css/style.css">
    {{block "page_resources" .}}{{end}}
    <script src="/static/js/notifications.js" defer></script>
</head>
<body>
    {{if .Username}}
    <nav>
        <div class="nav-left">
            <span class="brand" aria-label="Application name">agent&lt;</span>
            <a href="/">Home</a>
            <a href="/devices">Devices</a>
            <a href="/logs">Logs</a>
            {{if .IsAdmin}}
            <a href="/users">User Management</a>
            {{end}}
        </div>
        <div class="nav-right">
            <a href="/users/edit/{{.UserID}}" class="username">{{.Username}}</a>
            <div class="notification-bell" id="notification-bell" title="Notifications" aria-haspopup="true" aria-expanded="false" data-flicker-high="{{.FlickerHigh}}" data-flicker-medium="{{.FlickerMedium}}" data-flicker-low="{{.FlickerLow}}">
                <i class="bell-icon">🔔</i>
                <span class="notification-indicator" id="notification-indicator"></span>
                <div class="notification-dropdown hidden" id="notification-dropdown" role="menu" aria-label="Notifications">
                    <div class="notification-section">
                        <div class="notification-category" data-level="high">High <span class="count" id="notif-count-high">0</span></div>
                        <div class="notification-category" data-level="medium">Medium <span class="count" id="notif-count-medium">0</span></div>
                        <div class="notification-category" data-level="low">Low <span class="count" id="notif-count-low">0</span></div>
                    </div>
                    <div class="notification-recent" id="notification-recent"></div>
                    <div class="notification-actions">
                        <button class="btn btn-secondary" id="mark-all-seen" type="button">Mark all as seen</button>
                    </div>
                </div>
            </div>
            <a href="/logout" class="btn btn-secondary">Logout</a>
        </div>
    </nav>
    {{end}}
    <main>
        {{block "content" .}}{{end}}
    </main>
</body>
</html>
{{end}}
