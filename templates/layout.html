{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - agent<</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {{block "page_resources" .}}{{end}}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Add click handler to the bell icon
            var notificationBell = document.getElementById('notification-bell');
            if (notificationBell) {
                notificationBell.addEventListener('click', function() {
                    // When clicked, remove the active class (red indicator)
                    var indicator = document.getElementById('notification-indicator');
                    if (indicator) {
                        indicator.classList.remove('active');
                    }
                    // Redirect to logs page with high security filter
                    window.location.href = '/logs?security_level=high';
                });
            }
        });
    </script>
</head>
<body>
    {{if .Username}}
    <nav>
        <div class="nav-left">
            <a href="/">Home</a>
            <a href="/devices">Devices</a>
            <a href="/logs">Logs</a>
            {{if .IsAdmin}}
            <a href="/users">User Management</a>
            {{end}}
        </div>
        <div class="nav-right">
            <a href="/users/edit" class="username">{{.Username}}</a>
            <div class="notification-bell" id="notification-bell" title="Notifications">
                <i class="bell-icon">🔔</i>
                <span class="notification-indicator" id="notification-indicator"></span>
            </div>
            <a href="/logout" class="btn btn-secondary">Logout</a>
        </div>
    </nav>
    {{end}}
    <main>
        {{block "content" .}}{{end}}
    </main>
</body>
</html>
{{end}}
